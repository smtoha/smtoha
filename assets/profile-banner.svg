<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">S.M. Toha — Full-stack developer</title>
<desc id="desc">A premium dark purple gradient banner with subtle grid, glowing orbs, and a terminal-inspired code window.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100D18"/><stop offset=".56" stop-color="#211431"/><stop offset="1" stop-color="#17172B"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C084FC"/><stop offset=".55" stop-color="#E879F9"/><stop offset="1" stop-color="#8B9DFF"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#A855F7" stop-opacity=".36"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#background)"/>
<circle cx="880" cy="105" r="190" fill="url(#orb)"/><circle cx="1080" cy="290" r="170" fill="#7C3AED" opacity=".12" filter="url(#blur)"/>
<g stroke="#C4B5FD" stroke-opacity=".075" stroke-width="1"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/><path d="M60 0V360M120 0V360M180 0V360M240 0V360M300 0V360M360 0V360M420 0V360M480 0V360M540 0V360M600 0V360M660 0V360M720 0V360M780 0V360M840 0V360M900 0V360M960 0V360M1020 0V360M1080 0V360M1140 0V360"/></g>
<rect x="64" y="64" width="5" height="220" rx="3" fill="url(#accent)"/>
<text x="94" y="94" fill="#D8B4FE" font-family="monospace" font-size="14" letter-spacing="4">DEVELOPER · BUILDER · LIFELONG LEARNER</text>
<text x="90" y="166" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="-2">S.M. TOHA</text>
<text x="94" y="211" fill="#E9D5FF" font-family="Arial,Helvetica,sans-serif" font-size="24">Building thoughtful digital experiences.</text>
<text x="94" y="258" fill="#B8AFC9" font-family="monospace" font-size="15">FULL-STACK / AI EXPLORATION / COMPILER PROJECTS</text>
<g transform="translate(850 90)">
  <rect width="274" height="174" rx="16" fill="#171221" fill-opacity=".82" stroke="#8B5CF6" stroke-opacity=".65"/>
  <path d="M0 40H274" stroke="#8B5CF6" stroke-opacity=".35"/>
  <circle cx="20" cy="20" r="4" fill="#F0ABFC"/><circle cx="35" cy="20" r="4" fill="#C4B5FD"/><circle cx="50" cy="20" r="4" fill="#818CF8"/>
  <text x="20" y="70" fill="#C4B5FD" font-family="monospace" font-size="13">$ build --ideas</text>
  <text x="20" y="98" fill="#F5D0FE" font-family="monospace" font-size="13">compile curiosity</text>
  <text x="20" y="126" fill="#A7F3D0" font-family="monospace" font-size="13">✓ ship useful things</text>
  <rect x="20" y="145" width="8" height="13" rx="1" fill="url(#accent)"/>
